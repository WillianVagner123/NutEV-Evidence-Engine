name: bootstrap-platform-admin

on:
  workflow_run:
    workflows: ["deploy-hetzner"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nutev-platform-admin-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: ensure first PLATFORM_ADMIN
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: HETZNER
    timeout-minutes: 10
    env:
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER }}
      HETZNER_PORT: ${{ vars.HETZNER_PORT }}
      HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
      HETZNER_APP_DIR: ${{ vars.HETZNER_APP_DIR }}
      BOOTSTRAP_ADMIN_EMAIL: wvagners@hotmail.com
      BOOTSTRAP_ADMIN_DISPLAY_NAME: Willian Vagner
      BOOTSTRAP_ADMIN_INSTITUTION: NutEV
      BOOTSTRAP_ADMIN_INTENDED_USE: First platform administrator bootstrap for governed NutEV access.

    steps:
      - name: Checkout bootstrap encryption key
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Validate trusted connection configuration
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HETZNER_HOST"
          test -n "$HETZNER_USER"
          test -n "$HETZNER_APP_DIR"
          test -n "$HETZNER_KNOWN_HOSTS"
          test -n "$HETZNER_SSH_KEY"
          test -s config/bootstrap_invitation_public.pem
          openssl pkey -pubin -in config/bootstrap_invitation_public.pem -noout
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure platform administrator exists or request invitation
        id: ensure
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          APP_DIR_Q=$(printf '%q' "$HETZNER_APP_DIR")
          ADMIN_EMAIL_Q=$(printf '%q' "$BOOTSTRAP_ADMIN_EMAIL")

          REMOTE_RESULT=$(ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -p "$PORT" "$HETZNER_USER@$HETZNER_HOST" \
            "APP_DIR=$APP_DIR_Q ADMIN_EMAIL=$ADMIN_EMAIL_Q bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          test -f deploy/hetzner/.env
          CONTAINER=$(docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml ps -q nutev)
          test -n "$CONTAINER"

          ADMIN_COUNT=$(docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev \
            python - <<'PY'
          import json, os, sqlite3
          database = os.environ.get('NUTEV_AUTH_DB') or '/app/project_output_reference/platform/auth.sqlite3'
          with sqlite3.connect(database) as connection:
              rows = connection.execute("SELECT status, global_roles_json FROM platform_auth_users").fetchall()
          count = 0
          for status, payload in rows:
              try:
                  roles = json.loads(payload or '[]')
              except json.JSONDecodeError:
                  continue
              if status == 'active' and 'PLATFORM_ADMIN' in roles:
                  count += 1
          print(count)
          PY
          )

          if [[ "$ADMIN_COUNT" =~ ^[0-9]+$ ]] && (( ADMIN_COUNT > 0 )); then
            echo "platform_admin_state=READY existing_admin_count=$ADMIN_COUNT changed=false"
            exit 0
          fi

          USER_STATE=$(docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev \
            env BOOTSTRAP_ADMIN_EMAIL="$ADMIN_EMAIL" python - <<'PY'
          import os, sqlite3
          database = os.environ.get('NUTEV_AUTH_DB') or '/app/project_output_reference/platform/auth.sqlite3'
          email = str(os.environ['BOOTSTRAP_ADMIN_EMAIL']).strip().casefold()
          with sqlite3.connect(database) as connection:
              row = connection.execute(
                  "SELECT status FROM platform_auth_users WHERE email = ? COLLATE NOCASE LIMIT 1",
                  (email,),
              ).fetchone()
          print('missing' if row is None else str(row[0]))
          PY
          )

          if [[ "$USER_STATE" == "missing" ]]; then
            echo "platform_admin_state=INVITATION_REQUIRED changed=false"
            exit 0
          fi
          if [[ "$USER_STATE" != "active" ]]; then
            echo "First-admin identity exists but is not active; refusing role mutation." >&2
            exit 5
          fi

          set +e
          RESULT=$(docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev \
            python tools/grant_platform_admin.py --email "$ADMIN_EMAIL" 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$RESULT"
          if [[ "$RC" -ne 0 ]]; then
            echo "First-admin bootstrap failed closed without creating a user, password, workspace, project, or scientific state." >&2
            exit "$RC"
          fi

          VERIFY_COUNT=$(docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev \
            python - <<'PY'
          import json, os, sqlite3
          database = os.environ.get('NUTEV_AUTH_DB') or '/app/project_output_reference/platform/auth.sqlite3'
          with sqlite3.connect(database) as connection:
              rows = connection.execute("SELECT status, global_roles_json FROM platform_auth_users").fetchall()
          count = sum(
              1 for status, payload in rows
              if status == 'active' and 'PLATFORM_ADMIN' in json.loads(payload or '[]')
          )
          print(count)
          PY
          )
          [[ "$VERIFY_COUNT" =~ ^[0-9]+$ ]]
          (( VERIFY_COUNT > 0 ))
          echo "platform_admin_state=READY existing_admin_count=$VERIFY_COUNT changed=true"
          REMOTE
          )

          printf '%s\n' "$REMOTE_RESULT"
          if grep -qx 'platform_admin_state=INVITATION_REQUIRED changed=false' <<<"$REMOTE_RESULT"; then
            printf 'invitation_required=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'invitation_required=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify bootstrap identity and PLATFORM_ADMIN role
        if: ${{ steps.ensure.outputs.invitation_required != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          APP_DIR_Q=$(printf '%q' "$HETZNER_APP_DIR")
          ADMIN_EMAIL_Q=$(printf '%q' "$BOOTSTRAP_ADMIN_EMAIL")

          set +e
          VERIFY_RESULT=$(ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -p "$PORT" "$HETZNER_USER@$HETZNER_HOST" \
            "APP_DIR=$APP_DIR_Q ADMIN_EMAIL=$ADMIN_EMAIL_Q bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          test -f deploy/hetzner/.env
          docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev \
            env BOOTSTRAP_ADMIN_EMAIL="$ADMIN_EMAIL" python - <<'PY'
          import json
          import os
          import sqlite3

          database = os.environ.get('NUTEV_AUTH_DB') or '/app/project_output_reference/platform/auth.sqlite3'
          email = str(os.environ['BOOTSTRAP_ADMIN_EMAIL']).strip().casefold()
          with sqlite3.connect(database) as connection:
              row = connection.execute(
                  "SELECT status, global_roles_json FROM platform_auth_users "
                  "WHERE email = ? COLLATE NOCASE LIMIT 1",
                  (email,),
              ).fetchone()

          if row is None:
              print("bootstrap_identity_present=false bootstrap_identity_active=false bootstrap_platform_admin=false")
              raise SystemExit(6)

          status, payload = row
          try:
              roles = json.loads(payload or '[]')
          except json.JSONDecodeError:
              roles = []
          active = str(status) == 'active'
          admin = 'PLATFORM_ADMIN' in roles
          print(
              "bootstrap_identity_present=true "
              f"bootstrap_identity_active={'true' if active else 'false'} "
              f"bootstrap_platform_admin={'true' if admin else 'false'}"
          )
          if not active:
              raise SystemExit(7)
          if not admin:
              raise SystemExit(8)
          PY
          REMOTE
          )
          VERIFY_RC=$?
          set -e
          printf '%s\n' "$VERIFY_RESULT"
          if [[ "$VERIFY_RC" -ne 0 ]]; then
            echo "Bootstrap administrator identity/role verification failed without mutating credentials, memberships, projects, or scientific state." >&2
            exit "$VERIFY_RC"
          fi

      - name: Issue invitation and encrypt token in transit
        if: ${{ steps.ensure.outputs.invitation_required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          APP_DIR_Q=$(printf '%q' "$HETZNER_APP_DIR")
          ADMIN_EMAIL_Q=$(printf '%q' "$BOOTSTRAP_ADMIN_EMAIL")
          DISPLAY_NAME_Q=$(printf '%q' "$BOOTSTRAP_ADMIN_DISPLAY_NAME")
          INSTITUTION_Q=$(printf '%q' "$BOOTSTRAP_ADMIN_INSTITUTION")
          INTENDED_USE_Q=$(printf '%q' "$BOOTSTRAP_ADMIN_INTENDED_USE")

          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -p "$PORT" "$HETZNER_USER@$HETZNER_HOST" \
            "APP_DIR=$APP_DIR_Q ADMIN_EMAIL=$ADMIN_EMAIL_Q DISPLAY_NAME=$DISPLAY_NAME_Q INSTITUTION=$INSTITUTION_Q INTENDED_USE=$INTENDED_USE_Q bash -s" <<'REMOTE' \
            | openssl pkeyutl -encrypt -pubin \
                -inkey config/bootstrap_invitation_public.pem \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
                -out bootstrap-invitation-token.enc
          set -euo pipefail
          cd "$APP_DIR"
          docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev \
            python tools/seed_bootstrap_access_invitation.py \
              --email "$ADMIN_EMAIL" \
              --display-name "$DISPLAY_NAME" \
              --institution "$INSTITUTION" \
              --intended-use "$INTENDED_USE"
          REMOTE

          test -s bootstrap-invitation-token.enc
          echo "platform_admin_state=INVITATION_REQUIRED encrypted_token_artifact=true raw_token_logged=false"

      - name: Upload encrypted invitation handoff
        if: ${{ steps.ensure.outputs.invitation_required == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootstrap-platform-admin-invitation-${{ github.run_id }}-${{ github.run_attempt }}
          path: bootstrap-invitation-token.enc
          if-no-files-found: error
          retention-days: 1
