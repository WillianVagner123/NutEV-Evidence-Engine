name: deploy-hetzner

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hetzner-production
  cancel-in-progress: false

jobs:
  release-prerequisites:
    name: exact-SHA release prerequisites
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main') ||
          (vars.HETZNER_AUTODEPLOY == 'true' &&
           github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      target_sha: ${{ steps.verify.outputs.sha }}
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify all release prerequisites for current main
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/check_release_prerequisites.py \
            --repo "$GITHUB_REPOSITORY" --sha "$TARGET_SHA" \
            --output release-prerequisites.json --wait-seconds 900
          printf 'sha=%s\n' "$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload prerequisite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-prerequisites-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-prerequisites.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: deploy production
    needs: release-prerequisites
    if: ${{ needs.release-prerequisites.result == 'success' }}
    runs-on: ubuntu-latest
    environment: HETZNER
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ needs.release-prerequisites.outputs.target_sha }}
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER }}
      HETZNER_PORT: ${{ vars.HETZNER_PORT }}
      HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
      HETZNER_APP_DIR: ${{ vars.HETZNER_APP_DIR }}
      NUTEV_PUBLIC_URL: ${{ vars.NUTEV_PUBLIC_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Revalidate candidate after environment approval and before SSH
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/check_release_prerequisites.py
          --repo "$GITHUB_REPOSITORY" --sha "$TARGET_SHA"
          --output release-prerequisites-recheck.json
      - name: Validate deployment configuration
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          test -n "$HETZNER_HOST"
          test -n "$HETZNER_USER"
          test -n "$HETZNER_APP_DIR"
          test -n "$HETZNER_SSH_KEY"

      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          install -d -m 700 ~/.ssh
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path
          raw = os.environ["HETZNER_SSH_KEY"].strip()
          raw = raw.replace("\r\n", "\n").replace("\r", "\n")
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\n", "\n")
          candidate = raw.strip()
          if candidate.startswith("ssh-") or "BEGIN PUBLIC KEY" in candidate:
              raise SystemExit("HETZNER_SSH_KEY contains a public key; the complete private key is required")
          if not candidate.startswith("-----BEGIN "):
              compact = "".join(candidate.split())
              try:
                  decoded = base64.b64decode(compact, validate=True).decode("utf-8").strip()
              except (binascii.Error, UnicodeDecodeError, ValueError):
                  decoded = ""
              if decoded.startswith("-----BEGIN "):
                  candidate = decoded.replace("\r\n", "\n").replace("\r", "\n")
          Path.home().joinpath(".ssh", "id_ed25519").write_text(candidate.strip() + "\n", encoding="utf-8")
          PY
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub 2>/dev/null; then
            echo "::error::HETZNER_SSH_KEY could not be parsed as an unencrypted private SSH key after raw/literal-newline/base64 normalization. Ensure the HETZNER environment secret contains the complete private key (not .pub), without a passphrase." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/id_ed25519.pub
          test -n "$HETZNER_KNOWN_HOSTS"
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          HOST_LOOKUP="$HETZNER_HOST"
          if [[ "$PORT" != "22" ]]; then HOST_LOOKUP="[$HETZNER_HOST]:$PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null

      - name: Verify SSH access
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -p "$PORT" "$HETZNER_USER@$HETZNER_HOST" 'printf "ssh-ok\n"' | grep -qx 'ssh-ok'

      - name: Inspect 80/443 ownership before any service mutation
        id: proxy
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          PUBLIC_URL="${NUTEV_PUBLIC_URL:-https://nutev.mindsperformance.com.br}"
          INSPECT_PUBLIC_URL_Q=$(printf '%q' "$PUBLIC_URL")
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -p "$PORT" "$HETZNER_USER@$HETZNER_HOST" \
            "PUBLIC_URL=$INSPECT_PUBLIC_URL_Q bash -s" < tools/remote_proxy_inventory.sh | tee hetzner-proxy-baseline.txt
          MODE=$(awk -F= '$1=="NUTEV_PROXY_MODE" {print $2}' hetzner-proxy-baseline.txt | tail -n1)
          [[ "$MODE" = managed || "$MODE" = external ]]
          printf 'mode=%s\n' "$MODE" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized infrastructure baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hetzner-proxy-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: hetzner-proxy-baseline.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy verified commit to Hetzner
        env:
          PROXY_MODE: ${{ steps.proxy.outputs.mode }}
          EVIDENCE_DIR: /tmp/nutev-deploy-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          APP_DIR_Q=$(printf '%q' "$HETZNER_APP_DIR")
          TARGET_SHA_Q=$(printf '%q' "$TARGET_SHA")
          PUBLIC_URL_Q=$(printf '%q' "${NUTEV_PUBLIC_URL:-https://nutev.mindsperformance.com.br}")
          PROXY_MODE_Q=$(printf '%q' "$PROXY_MODE")
          EVIDENCE_DIR_Q=$(printf '%q' "$EVIDENCE_DIR")
          SSH_OPTS=(-o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -p "$PORT")
          TARGET="$HETZNER_USER@$HETZNER_HOST"
          REMOTE_SCRIPT="/tmp/nutev-remote-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          REMOTE_SCRIPT_Q=$(printf '%q' "$REMOTE_SCRIPT")
          SCRIPT_SHA="$(sha256sum deploy/hetzner/remote_deploy.sh | cut -d' ' -f1)"

          # Deliver the script as a file and verify its digest BEFORE executing anything.
          # Streaming it into `bash -s` made a truncated delivery look like a clean deploy:
          # bash reached EOF mid-script and exited 0, skipping the post-promotion contract,
          # the build-identity assertion, the public edge smoke and the rollback path.
          ssh "${SSH_OPTS[@]}" "$TARGET" "cat > $REMOTE_SCRIPT_Q" < deploy/hetzner/remote_deploy.sh
          ssh "${SSH_OPTS[@]}" "$TARGET" \
            "printf '%s  %s\\n' $(printf '%q' "$SCRIPT_SHA") $REMOTE_SCRIPT_Q | sha256sum -c -"

          set +e
          ssh "${SSH_OPTS[@]}" "$TARGET" \
            "APP_DIR=$APP_DIR_Q TARGET_SHA=$TARGET_SHA_Q PUBLIC_URL=$PUBLIC_URL_Q PROXY_MODE=$PROXY_MODE_Q EVIDENCE_DIR=$EVIDENCE_DIR_Q bash $REMOTE_SCRIPT_Q" \
            2>&1 | tee deploy-session.log
          SSH_STATUS="${PIPESTATUS[0]}"
          set -e
          if [[ "$SSH_STATUS" != "0" ]]; then
            echo "::error::Remote deploy exited with status $SSH_STATUS." >&2
            exit "$SSH_STATUS"
          fi

          # A clean ssh exit is not proof the script finished. Require the sentinel the
          # remote script prints as its final act.
          if ! grep -q "NUTEV_REMOTE_DEPLOY_COMPLETE $TARGET_SHA" deploy-session.log; then
            echo "::error::Remote deploy ended without its completion sentinel; treating this as a failed promotion." >&2
            exit 1
          fi
          echo "Remote deploy completed and verified for $TARGET_SHA."

      - name: Collect post-promotion deploy evidence
        if: always()
        env:
          EVIDENCE_DIR: /tmp/nutev-deploy-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p deploy-evidence
          [[ -f deploy-session.log ]] && mv deploy-session.log deploy-evidence/ || true
          PORT="${HETZNER_PORT:-22}"
          EVIDENCE_DIR_Q=$(printf '%q' "$EVIDENCE_DIR")
          # Best effort: evidence collection must never turn a good deploy red, and a
          # missing directory is itself worth seeing in the artifact.
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -p "$PORT" "$HETZNER_USER@$HETZNER_HOST" \
            "cd $EVIDENCE_DIR_Q 2>/dev/null && tar -cf - . || true" \
            | tar -xf - -C deploy-evidence 2>/dev/null || echo "no remote evidence directory" > deploy-evidence/MISSING.txt
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -p "$PORT" "$HETZNER_USER@$HETZNER_HOST" "rm -rf $EVIDENCE_DIR_Q" || true
          ls -la deploy-evidence || true

      - name: Upload post-promotion deploy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hetzner-deploy-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-evidence/
          if-no-files-found: warn
          retention-days: 14
