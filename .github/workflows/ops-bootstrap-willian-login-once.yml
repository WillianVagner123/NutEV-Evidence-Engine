name: ops-bootstrap-willian-login-once

on:
  push:
    branches:
      - ops/bootstrap-willian-login-20260922

permissions:
  contents: read

concurrency:
  group: ops-bootstrap-willian-login-once
  cancel-in-progress: false

jobs:
  bootstrap:
    name: create Willian production login
    runs-on: ubuntu-latest
    environment: HETZNER
    timeout-minutes: 10
    env:
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER }}
      HETZNER_PORT: ${{ vars.HETZNER_PORT }}
      HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
      HETZNER_APP_DIR: ${{ vars.HETZNER_APP_DIR }}
      NUTEV_BOOTSTRAP_PUBLIC_KEY_B64: ""

    steps:
      - name: Configure trusted SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HETZNER_HOST"
          test -n "$HETZNER_USER"
          test -n "$HETZNER_APP_DIR"
          test -n "$HETZNER_KNOWN_HOSTS"
          test -n "$HETZNER_SSH_KEY"
          install -d -m 700 ~/.ssh
          python3 - <<'PY'
          import base64, binascii, os
          from pathlib import Path
          raw=os.environ["HETZNER_SSH_KEY"].strip().replace("\r\n","\n").replace("\r","\n")
          if "\\n" in raw and "\n" not in raw:
              raw=raw.replace("\\n","\n")
          candidate=raw.strip()
          if candidate.startswith("ssh-") or "BEGIN PUBLIC KEY" in candidate:
              raise SystemExit("public key supplied where private key is required")
          if not candidate.startswith("-----BEGIN "):
              compact="".join(candidate.split())
              try:
                  decoded=base64.b64decode(compact, validate=True).decode("utf-8").strip()
              except (binascii.Error, UnicodeDecodeError, ValueError):
                  decoded=""
              if decoded.startswith("-----BEGIN "):
                  candidate=decoded.replace("\r\n","\n").replace("\r","\n")
          path=Path.home()/".ssh"/"id_ed25519"
          path.write_text(candidate.strip()+"\n",encoding="utf-8")
          PY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create account and return only encrypted temporary password
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          APP_DIR_Q=$(printf '%q' "$HETZNER_APP_DIR")
          PUB_Q=$(printf '%q' "$NUTEV_BOOTSTRAP_PUBLIC_KEY_B64")

          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15             -p "$PORT" "$HETZNER_USER@$HETZNER_HOST"             "APP_DIR=$APP_DIR_Q PUB_B64=$PUB_Q bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          test -f deploy/hetzner/.env
          command -v openssl >/dev/null
          PUB_FILE=$(mktemp)
          trap 'rm -f "$PUB_FILE"' EXIT
          printf '%s' "$PUB_B64" | base64 -d > "$PUB_FILE"
          openssl pkey -pubin -in "$PUB_FILE" -noout >/dev/null

          STATE=$(docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev             python - <<'PY'
          import json, os, sqlite3
          db=os.environ.get("NUTEV_AUTH_DB") or "/app/project_output_reference/platform/auth.sqlite3"
          with sqlite3.connect(db) as c:
              row=c.execute(
                  "SELECT status, global_roles_json FROM platform_auth_users WHERE email=? COLLATE NOCASE",
                  ("wvagners@hotmail.com",),
              ).fetchone()
          if row is None:
              print("missing")
          else:
              try:
                  roles=json.loads(row[1] or "[]")
              except Exception:
                  roles=[]
              print("existing:"+str(row[0])+":"+(",".join(sorted(roles))))
          PY
          )

          if [[ "$STATE" != "missing" ]]; then
            echo "account_state=$STATE changed=false"
            exit 20
          fi

          PASSWORD=$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(24))
          PY
          )

          printf '%s\n' "$PASSWORD" | docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev             python -c 'import json, os, sys; from pathlib import Path; from nutev.tenancy import SQLiteAuthProvider, GlobalRole; pw=sys.stdin.readline().rstrip("\n"); db=Path(os.environ.get("NUTEV_AUTH_DB") or "/app/project_output_reference/platform/auth.sqlite3"); user=SQLiteAuthProvider(db).provision_user(email="wvagners@hotmail.com", display_name="Willian Vagner", password=pw, global_roles={GlobalRole.PLATFORM_ADMIN}); print(json.dumps({"user_id":user.id,"email":user.email,"status":user.status},sort_keys=True))'

          VERIFY=$(docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev             python - <<'PY'
          import json, os, sqlite3
          db=os.environ.get("NUTEV_AUTH_DB") or "/app/project_output_reference/platform/auth.sqlite3"
          with sqlite3.connect(db) as c:
              row=c.execute(
                  "SELECT id,status,global_roles_json FROM platform_auth_users WHERE email=? COLLATE NOCASE",
                  ("wvagners@hotmail.com",),
              ).fetchone()
          if row is None:
              raise SystemExit(3)
          roles=json.loads(row[2] or "[]")
          if row[1] != "active" or "PLATFORM_ADMIN" not in roles:
              raise SystemExit(4)
          print(row[0])
          PY
          )

          CIPHER=$(printf '%s' "$PASSWORD" | openssl pkeyutl -encrypt -pubin             -inkey "$PUB_FILE"             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256 | base64 -w0)
          unset PASSWORD
          echo "account_state=created changed=true user_id=$VERIFY"
          echo "password_ciphertext_b64=$CIPHER"
          REMOTE
