name: ops-inspect-article1-workproducts-once

on:
  push:
    branches:
      - ops/inspect-article1-workproducts-20260923

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: HETZNER
    timeout-minutes: 10
    env:
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER }}
      HETZNER_PORT: ${{ vars.HETZNER_PORT }}
      HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
      HETZNER_APP_DIR: ${{ vars.HETZNER_APP_DIR }}
    steps:
      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Inspect known Article 1 work products read-only
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          APP_DIR_Q=$(printf '%q' "$HETZNER_APP_DIR")
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15             -p "$PORT" "$HETZNER_USER@$HETZNER_HOST"             "APP_DIR=$APP_DIR_Q bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev             python - <<'PY'
          from __future__ import annotations
          import hashlib, json
          from pathlib import Path

          roots=[Path("/app"),Path("/app/project_output_reference")]
          wanted=[
              "ARTICLE1_CURRENT_STATE.md",
              "ARTICLE1_PRESS_PREP_V01.md",
              "ARTICLE1_PRESS_PREP_V02.md",
              "ARTICLE1_QUERY_DELTA_PLAN.md",
              "ARTICLE1_KNOWN_ITEMS.md",
              "ARTICLE1_CONCEPT_MATRIX_V01.md",
              "ARTICLE1_PENDING_HUMAN_DECISIONS.md",
              "DELTA_RESULTS_20260922T162943Z.tsv",
              "article1_pubmed_dev_delta_runner.js",
          ]
          def digest(path:Path)->str:
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()

          out={"files":{},"precision_samples":{"present":False,"file_count":0,"files":[]}}
          seen=set()
          for root in roots:
              if not root.exists():
                  continue
              for name in wanted:
                  for p in root.rglob(name):
                      rp=str(p.resolve())
                      if rp in seen or not p.is_file() or p.is_symlink():
                          continue
                      seen.add(rp)
                      out["files"].setdefault(name,[]).append({
                          "bytes":p.stat().st_size,
                          "sha256":digest(p),
                      })
              for p in root.rglob("press_precision_samples"):
                  if not p.is_dir() or p.is_symlink():
                      continue
                  files=[x for x in p.rglob("*") if x.is_file() and not x.is_symlink()]
                  out["precision_samples"]["present"]=True
                  out["precision_samples"]["file_count"]+=len(files)
                  for x in files:
                      out["precision_samples"]["files"].append({
                          "name":x.name,
                          "bytes":x.stat().st_size,
                          "sha256":digest(x),
                      })
          print(json.dumps(out,sort_keys=True))
          PY
          REMOTE
