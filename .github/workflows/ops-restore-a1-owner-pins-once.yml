name: ops-restore-a1-owner-pins-once

on:
  push:
    branches:
      - ops/restore-a1-owner-pins-20260922

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: HETZNER
    timeout-minutes: 10
    env:
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER }}
      HETZNER_PORT: ${{ vars.HETZNER_PORT }}
      HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
      HETZNER_APP_DIR: ${{ vars.HETZNER_APP_DIR }}
    steps:
      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Restore durable Article 1 owner pins
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          APP_DIR_Q=$(printf '%q' "$HETZNER_APP_DIR")
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15             -p "$PORT" "$HETZNER_USER@$HETZNER_HOST"             "APP_DIR=$APP_DIR_Q bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          COMPOSE=(docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml)
          C="$("${COMPOSE[@]}" ps -q nutev)"
          test -n "$C"
          IMAGE=$(docker inspect -f '{{.Config.Image}}' "$C")
          test -n "$IMAGE"

          install -d -m 700 /etc/nutev
          cat > /etc/nutev/article1-owner.env <<'EOF'
          NUTEV_A1_WORKSPACE_ID=wsp_b04b7be90f8e4c7ba88957c2e15776c8
          NUTEV_A1_PROJECT_ID=prj_046d6070c92c4702a79de018ac1498d0
          EOF
          chmod 600 /etc/nutev/article1-owner.env
          chown root:root /etc/nutev/article1-owner.env

          python3 - <<'PY'
          from pathlib import Path
          import os, re, tempfile
          target=Path("deploy/hetzner/.env")
          text=target.read_text(encoding="utf-8")
          values={}
          for line in Path("/etc/nutev/article1-owner.env").read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              k,v=line.split("=",1)
              values[k]=v
          for key,value in values.items():
              pat=re.compile(rf"(?m)^{re.escape(key)}=.*$")
              if pat.search(text):
                  text=pat.sub(f"{key}={value}",text)
              else:
                  text=text.rstrip()+"\n"+f"{key}={value}\n"
          fd,tmp=tempfile.mkstemp(prefix=".env.a1.",dir=str(target.parent))
          try:
              os.write(fd,text.encode("utf-8"))
              os.close(fd)
              os.chmod(tmp,0o600)
              os.replace(tmp,target)
          except Exception:
              try: os.close(fd)
              except OSError: pass
              try: os.unlink(tmp)
              except OSError: pass
              raise
          PY

          NUTEV_IMAGE="$IMAGE" "${COMPOSE[@]}" up -d --no-build --force-recreate nutev >/dev/null

          for _ in $(seq 1 30); do
            curl -fsS --max-time 3 http://127.0.0.1:8765/api/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8765/api/health >/dev/null

          "${COMPOSE[@]}" exec -T nutev python - <<'PY'
          import json, os
          from pathlib import Path
          from first_party_source_access import article1_source_owner_allowed
          w="wsp_b04b7be90f8e4c7ba88957c2e15776c8"
          p="prj_046d6070c92c4702a79de018ac1498d0"
          proc={}
          for item in Path("/proc/1/environ").read_bytes().split(b"\0"):
              if b"=" in item:
                  k,v=item.split(b"=",1)
                  if k in {b"NUTEV_A1_WORKSPACE_ID",b"NUTEV_A1_PROJECT_ID"}:
                      proc[k.decode()]=v.decode()
          assert os.environ.get("NUTEV_A1_WORKSPACE_ID")==w
          assert os.environ.get("NUTEV_A1_PROJECT_ID")==p
          assert proc.get("NUTEV_A1_WORKSPACE_ID")==w
          assert proc.get("NUTEV_A1_PROJECT_ID")==p
          assert article1_source_owner_allowed(w,p)
          print(json.dumps({
              "status":"PASS",
              "env_file_pins_present":True,
              "pid1_pins_present":True,
              "owner_guard_accepts_expected_scope":True,
              "scientific_state_modified":False,
          },sort_keys=True))
          PY
          REMOTE
