name: ops-provision-willian-a1-once

on:
  push:
    branches:
      - ops/provision-willian-a1-20260922

permissions:
  contents: read

concurrency:
  group: ops-provision-willian-a1-once
  cancel-in-progress: false

jobs:
  provision:
    name: create Willian doctorate workspace and A1
    runs-on: ubuntu-latest
    environment: HETZNER
    timeout-minutes: 10
    env:
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER }}
      HETZNER_PORT: ${{ vars.HETZNER_PORT }}
      HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
      HETZNER_APP_DIR: ${{ vars.HETZNER_APP_DIR }}

    steps:
      - name: Configure trusted SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HETZNER_HOST"
          test -n "$HETZNER_USER"
          test -n "$HETZNER_APP_DIR"
          test -n "$HETZNER_KNOWN_HOSTS"
          test -n "$HETZNER_SSH_KEY"
          install -d -m 700 ~/.ssh
          python3 - <<'PY'
          import base64, binascii, os
          from pathlib import Path
          raw=os.environ["HETZNER_SSH_KEY"].strip().replace("\r\n","\n").replace("\r","\n")
          if "\\n" in raw and "\n" not in raw:
              raw=raw.replace("\\n","\n")
          candidate=raw.strip()
          if candidate.startswith("ssh-") or "BEGIN PUBLIC KEY" in candidate:
              raise SystemExit("public key supplied where private key is required")
          if not candidate.startswith("-----BEGIN "):
              compact="".join(candidate.split())
              try:
                  decoded=base64.b64decode(compact, validate=True).decode("utf-8").strip()
              except (binascii.Error, UnicodeDecodeError, ValueError):
                  decoded=""
              if decoded.startswith("-----BEGIN "):
                  candidate=decoded.replace("\r\n","\n").replace("\r","\n")
          path=Path.home()/".ssh"/"id_ed25519"
          path.write_text(candidate.strip()+"\n",encoding="utf-8")
          PY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Provision workspace project and scoping-review application
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          APP_DIR_Q=$(printf '%q' "$HETZNER_APP_DIR")
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15             -p "$PORT" "$HETZNER_USER@$HETZNER_HOST"             "APP_DIR=$APP_DIR_Q bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          test -f deploy/hetzner/.env
          docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev             python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          from nutev.tenancy import (
              ApplicationService,
              Principal,
              SCOPING_REVIEW,
              SQLiteApplicationStore,
              SQLiteWorkspaceProjectStore,
              WorkspaceProjectService,
              new_opaque_id,
          )

          db=Path(os.environ.get("NUTEV_AUTH_DB") or "/app/project_output_reference/platform/auth.sqlite3")
          email="wvagners@hotmail.com"
          workspace_name="Doutorado — Willian Vagner"
          workspace_slug="willian-doutorado"
          project_name="Artigo 1"
          project_slug="artigo-1"

          with sqlite3.connect(f"file:{db}?mode=ro", uri=True) as c:
              c.row_factory=sqlite3.Row
              user=c.execute(
                  "SELECT id,status,global_roles_json FROM platform_auth_users WHERE email=? COLLATE NOCASE",
                  (email,),
              ).fetchone()
          if user is None:
              raise SystemExit("owner_not_found")
          if str(user["status"])!="active":
              raise SystemExit("owner_not_active")
          roles=json.loads(str(user["global_roles_json"] or "[]"))
          if "PLATFORM_ADMIN" not in roles:
              raise SystemExit("platform_admin_required")
          owner_id=str(user["id"])

          store=SQLiteWorkspaceProjectStore(db)
          access=WorkspaceProjectService(store)
          apps=ApplicationService(SQLiteApplicationStore(db),access)

          with sqlite3.connect(f"file:{db}?mode=ro",uri=True) as c:
              c.row_factory=sqlite3.Row
              wsrow=c.execute("SELECT id,owner_user_id,status,name FROM platform_workspaces WHERE slug=?",(workspace_slug,)).fetchone()

          workspace_created=False
          if wsrow is None:
              workspace=access.provision_workspace(owner_user_id=owner_id,name=workspace_name,slug=workspace_slug)
              workspace_created=True
          else:
              if str(wsrow["owner_user_id"])!=owner_id or str(wsrow["status"])!="active":
                  raise SystemExit("workspace_conflict")
              workspace=store.get_workspace(str(wsrow["id"]))

          principal=Principal(
              user_id=owner_id,
              workspace_memberships=tuple(access.memberships_for_user(owner_id)),
              global_roles=frozenset(),
              session_id=new_opaque_id("session"),
          )

          project_created=False
          project=next((p for p in store.list_projects(workspace.id) if p.slug==project_slug),None)
          if project is None:
              project=access.create_project(
                  principal,
                  workspace_id=workspace.id,
                  name=project_name,
                  slug=project_slug,
                  project_type="review",
              )
              project_created=True

          application_created=False
          try:
              application=apps.get(principal,workspace_id=workspace.id,project_id=project.id)
          except Exception:
              application=None
          if application is None:
              application=apps.configure(
                  principal,
                  workspace_id=workspace.id,
                  project_id=project.id,
                  template_id=SCOPING_REVIEW,
                  configuration={},
              )
              application_created=True

          print(json.dumps({
              "status":"provisioned" if (workspace_created or project_created or application_created) else "already_provisioned",
              "owner_email":email,
              "workspace":{"id":workspace.id,"name":workspace.name,"slug":workspace.slug,"created":workspace_created},
              "project":{"id":project.id,"name":project.name,"slug":project.slug,"created":project_created},
              "application":{"id":application.id,"type":application.application_type,"template_id":application.template_id,"created":application_created},
              "scientific_state_modified":False,
              "historical_binding_activated":False,
              "press_changed":False,
              "gf10_changed":False,
              "prisma_created":False,
          },ensure_ascii=False,sort_keys=True))
          PY
          REMOTE
