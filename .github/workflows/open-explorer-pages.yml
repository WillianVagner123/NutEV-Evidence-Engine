name: open-explorer-pages

# Publishes the static, login-free Open Evidence Explorer (apps/nutev-open) to
# GitHub Pages. The page has no back end, no secrets and no private data: it
# queries open bibliographic APIs from the visitor's browser and classifies
# records with the rule bundle generated from the canonical config.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "apps/nutev-open/**"
      - "config/**"
      - "src/nutev/**"
      - "tools/build_open_explorer_data.py"
      - "tools/rank_references.py"
      - "nutev_tests/test_open_explorer.py"
      - "nutev_tests/fixtures/open_explorer_harness.cjs"
      - ".github/workflows/open-explorer-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: open-explorer-pages
  cancel-in-progress: false

jobs:
  build:
    name: build open explorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/nutev-ci.txt
          python -m pip install --no-deps -e .
      - name: Verify rule bundle matches canonical config
        run: python tools/build_open_explorer_data.py --check
      - name: Verify Python/JavaScript parity and public-surface guardrails
        run: PYTHONPATH=src python -m pytest -q nutev_tests/test_open_explorer.py
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -R apps/nutev-open/. _site/
          cat > _site/build-info.js <<JS
          /* Generated by .github/workflows/open-explorer-pages.yml */
          (function (root) {
            "use strict";
            root.NUTEV_OPEN_BUILD = { commit: "${GITHUB_SHA}", built_at: "$(date -u +%Y-%m-%dT%H:%M:%SZ)", source: "github-pages" };
          })(typeof globalThis !== "undefined" ? globalThis : this);
          JS
          node --check _site/build-info.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
