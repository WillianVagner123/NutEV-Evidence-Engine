name: ops-activate-willian-a1-binding-once

on:
  push:
    branches:
      - ops/activate-willian-a1-binding-20260922

permissions:
  contents: read

concurrency:
  group: ops-activate-willian-a1-binding-once
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    environment: HETZNER
    timeout-minutes: 15
    env:
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER }}
      HETZNER_PORT: ${{ vars.HETZNER_PORT }}
      HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
      HETZNER_APP_DIR: ${{ vars.HETZNER_APP_DIR }}
      TARGET_SHA: e22f531a05e287580a66e4704f382ef16d66835e

    steps:
      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          python3 - <<'PY'
          import base64, binascii, os
          from pathlib import Path
          raw=os.environ["HETZNER_SSH_KEY"].strip().replace("\r\n","\n").replace("\r","\n")
          if "\\n" in raw and "\n" not in raw:
              raw=raw.replace("\\n","\n")
          candidate=raw.strip()
          if not candidate.startswith("-----BEGIN "):
              try:
                  decoded=base64.b64decode("".join(candidate.split()), validate=True).decode().strip()
              except (binascii.Error, UnicodeDecodeError, ValueError):
                  decoded=""
              if decoded.startswith("-----BEGIN "):
                  candidate=decoded
          path=Path.home()/".ssh"/"id_ed25519"
          path.write_text(candidate.strip()+"\n",encoding="utf-8")
          PY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Repair application binding and activate owner pins
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          APP_DIR_Q=$(printf '%q' "$HETZNER_APP_DIR")
          SHA_Q=$(printf '%q' "$TARGET_SHA")
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15             -p "$PORT" "$HETZNER_USER@$HETZNER_HOST"             "APP_DIR=$APP_DIR_Q TARGET_SHA=$SHA_Q bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          test -f deploy/hetzner/.env

          COMPOSE=(docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml)
          CONTAINER="$("${COMPOSE[@]}" ps -q nutev)"
          test -n "$CONTAINER"
          BEFORE_SHA=$(curl -fsS http://127.0.0.1:8765/api/version | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')
          test "$BEFORE_SHA" = "$TARGET_SHA"
          CURRENT_IMAGE=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER")
          test -n "$CURRENT_IMAGE"

          RESULT=$("${COMPOSE[@]}" exec -T nutev             python tools/provision_doctorate_article1.py               --owner-email "wvagners@hotmail.com"               --workspace-name "Doutorado — Willian Vagner"               --workspace-slug "willian-doutorado"               --project-name "Artigo 1"               --project-slug "artigo-1"               --project-type review               --article1-assembly)
          printf '%s\n' "$RESULT"

          WID=$(printf '%s\n' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace_id"])')
          PID=$(printf '%s\n' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["project_id"])')
          [[ "$WID" =~ ^wsp_[a-f0-9]{32}$ ]]
          [[ "$PID" =~ ^prj_[a-f0-9]{32}$ ]]

          WID="$WID" PID="$PID" python3 - <<'PY'
          import os, re, tempfile
          from pathlib import Path

          path=Path("deploy/hetzner/.env")
          text=path.read_text(encoding="utf-8")
          targets={
              "NUTEV_A1_WORKSPACE_ID": os.environ["WID"],
              "NUTEV_A1_PROJECT_ID": os.environ["PID"],
          }
          for key,value in targets.items():
              active=re.search(rf"(?m)^{re.escape(key)}=(.*)$",text)
              if active:
                  current=active.group(1).strip()
                  if current and current != value:
                      raise SystemExit(f"{key}_CONFLICT")
                  text=text[:active.start()]+f"{key}={value}"+text[active.end():]
              else:
                  text=text.rstrip()+"\n"+f"{key}={value}\n"
          fd,tmp=tempfile.mkstemp(prefix=".env.a1.",dir=str(path.parent),text=True)
          try:
              os.write(fd,text.encode("utf-8"))
              os.close(fd)
              os.chmod(tmp,0o600)
              os.replace(tmp,path)
          except Exception:
              try: os.close(fd)
              except OSError: pass
              try: os.unlink(tmp)
              except OSError: pass
              raise
          PY

          NUTEV_IMAGE="$CURRENT_IMAGE" "${COMPOSE[@]}" up -d --no-build nutev >/dev/null

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8765/api/health >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = "1"
          AFTER_SHA=$(curl -fsS http://127.0.0.1:8765/api/version | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')
          test "$AFTER_SHA" = "$TARGET_SHA"

          WID="$WID" PID="$PID" "${COMPOSE[@]}" exec -T             -e EXPECTED_WID="$WID" -e EXPECTED_PID="$PID" nutev python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          from apps.nutev_web.first_party_source_access import article1_source_owner_allowed

          wid=os.environ["EXPECTED_WID"]
          pid=os.environ["EXPECTED_PID"]
          assert os.environ.get("NUTEV_A1_WORKSPACE_ID")==wid
          assert os.environ.get("NUTEV_A1_PROJECT_ID")==pid
          assert article1_source_owner_allowed(wid,pid)

          db=Path(os.environ.get("NUTEV_AUTH_DB") or "/app/project_output_reference/platform/auth.sqlite3")
          with sqlite3.connect(db) as c:
              row=c.execute(
                  "SELECT configuration_json FROM platform_research_applications WHERE project_id=? AND status='active'",
                  (pid,),
              ).fetchone()
          assert row is not None
          conf=json.loads(row[0])
          assert conf.get("assembly_id")=="WILLIAN_DOCTORATE_A1"
          assert conf.get("d132_config_version")=="d132-v1"

          master=json.loads(Path("/app/config/nutev/article1_search_master_v1.json").read_text(encoding="utf-8"))
          formal=master["formal_search"]
          assert formal["gf10_authorized"] is False
          assert formal["query_freeze_complete"] is False
          assert formal["formal_provider_search_executed"] is False
          assert formal["prisma_search_event_emitted"] is False
          print(json.dumps({
              "status":"PASS",
              "owner_pins_match":True,
              "assembly_id":"WILLIAN_DOCTORATE_A1",
              "d132_config_version":"d132-v1",
              "deployed_sha":os.environ.get("NUTEV_BUILD_COMMIT",""),
              "scientific_state_modified":False,
              "press_pass_created":False,
              "gf10_authorized":False,
              "query_frozen":False,
              "formal_search_executed":False,
              "prisma_created":False,
          },sort_keys=True))
          PY
          REMOTE
