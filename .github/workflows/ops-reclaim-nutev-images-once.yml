name: ops-reclaim-nutev-images-once

on:
  push:
    branches:
      - ops/reclaim-nutev-images-20260922

permissions:
  contents: read

jobs:
  reclaim:
    runs-on: ubuntu-latest
    environment: HETZNER
    timeout-minutes: 10
    env:
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER }}
      HETZNER_PORT: ${{ vars.HETZNER_PORT }}
      HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Reclaim only unused legacy NutEV image tags
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15             -p "$PORT" "$HETZNER_USER@$HETZNER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          before=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "free_kb_before=$before"

          mapfile -t running_ids < <(docker ps -q | xargs -r docker inspect -f '{{.Image}}' | sort -u)
          mapfile -t refs < <(
            {
              docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^nutev:manual-' || true
              docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '^hetzner-nutev:latest$' || true
            } | sort -u
          )

          removed=0
          skipped=0
          for ref in "${refs[@]}"; do
            [[ -n "$ref" ]] || continue
            id=$(docker image inspect -f '{{.Id}}' "$ref")
            in_use=false
            for running in "${running_ids[@]}"; do
              if [[ "$id" == "$running" ]]; then in_use=true; break; fi
            done
            if [[ "$in_use" == "true" ]]; then
              echo "skip_in_use=$ref"
              skipped=$((skipped+1))
              continue
            fi
            docker image rm "$ref" >/dev/null
            echo "removed_unused_tag=$ref"
            removed=$((removed+1))
          done

          docker image prune -f >/dev/null
          after=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "removed_count=$removed"
          echo "skipped_in_use_count=$skipped"
          echo "free_kb_after=$after"
          echo "reclaimed_kb=$((after-before))"
          echo "scientific_volume_modified=false"
          REMOTE
