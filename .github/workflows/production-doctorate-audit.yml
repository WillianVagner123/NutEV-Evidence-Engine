name: production-doctorate-audit

on:
  workflow_run:
    workflows: ["deploy-hetzner"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  HETZNER_HOST: ${{ vars.HETZNER_HOST }}
  HETZNER_USER: ${{ vars.HETZNER_USER }}
  HETZNER_PORT: ${{ vars.HETZNER_PORT }}
  HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
  HETZNER_APP_DIR: ${{ vars.HETZNER_APP_DIR }}

jobs:
  audit:
    name: read-only doctorate runtime audit
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: HETZNER
    timeout-minutes: 10
    steps:
      - name: Validate trusted connection configuration
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$HETZNER_HOST"; test -n "$HETZNER_USER"; test -n "$HETZNER_APP_DIR"
          test -n "$HETZNER_KNOWN_HOSTS"; test -n "$HETZNER_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 >/dev/null 2>&1
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Collect sanitized read-only doctorate state
        id: collect
        run: |
          set -uo pipefail
          PORT="${HETZNER_PORT:-22}"
          APP_DIR_Q=$(printf '%q' "$HETZNER_APP_DIR")

          set +e
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -p "$PORT" "$HETZNER_USER@$HETZNER_HOST" \
            "APP_DIR=$APP_DIR_Q bash -s" <<'REMOTE' > doctorate-runtime.json
          set -euo pipefail
          cd "$APP_DIR"
          docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev \
            python tools/audit_doctorate_runtime.py --database /app/project_output_reference/platform/auth.sqlite3 \
            --output-root /app/project_output_reference --json
          REMOTE
          AUDIT_EXIT=$?
          set -e

          if [[ ! -s doctorate-runtime.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          Path('doctorate-runtime.json').write_text(json.dumps({
              'record_type':'NUTEV_WILLIAN_DOCTORATE_RUNTIME_AUDIT',
              'schema_version':1,
              'status':'FAIL',
              'reason':'remote_audit_command_failed_without_report',
              'read_only':True,
              'scientific_state_modified':False,
              'legacy_binding_performed':False,
              'search_executed':False,
          },indent=2)+'\n')
          PY
          fi

          python - "$AUDIT_EXIT" <<'PY'
          import json
          from pathlib import Path
          import sys

          audit_exit=int(sys.argv[1])
          data=json.loads(Path('doctorate-runtime.json').read_text())
          assert data.get('record_type')=='NUTEV_WILLIAN_DOCTORATE_RUNTIME_AUDIT'
          assert data.get('read_only') is True
          assert data.get('scientific_state_modified') is False
          assert data.get('legacy_binding_performed') is False
          assert data.get('search_executed') is False
          print('doctorate audit status:',data.get('status','UNKNOWN'))
          if data.get('status')=='PASS':
              print('doctorate audit:',data['article1']['application_count'],'A1 app(s),',data['article2']['application_count'],'A2 app(s)')
          else:
              print('doctorate audit reason:',data.get('reason','unspecified_fail_closed_result'))
          if audit_exit != 0 or data.get('status') != 'PASS':
              raise SystemExit(1)
          PY

      - name: Upload sanitized audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: doctorate-runtime-${{ github.run_id }}
          path: doctorate-runtime.json
          if-no-files-found: error
          retention-days: 14
