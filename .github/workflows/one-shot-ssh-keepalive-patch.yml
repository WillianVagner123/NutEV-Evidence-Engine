name: one-shot-ssh-keepalive-patch

on:
  push:
    branches:
      - fix/hetzner-ssh-keepalive-20260913

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hetzner-ssh-keepalive-20260913
      - name: Apply keepalive hardening and contract test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deploy-hetzner.yml')
          text = workflow.read_text(encoding='utf-8')
          needle = '          chmod 600 ~/.ssh/known_hosts\n          HOST_LOOKUP="$HETZNER_HOST"\n'
          replacement = (
              '          chmod 600 ~/.ssh/known_hosts\n'
              '          cat > ~/.ssh/config <<\'EOF\'\n'
              '          Host *\n'
              '            ServerAliveInterval 30\n'
              '            ServerAliveCountMax 10\n'
              '            TCPKeepAlive yes\n'
              '          EOF\n'
              '          chmod 600 ~/.ssh/config\n'
              '          HOST_LOOKUP="$HETZNER_HOST"\n'
          )
          if needle not in text:
              raise SystemExit('expected SSH configuration anchor not found')
          if 'ServerAliveInterval 30' in text:
              raise SystemExit('SSH keepalive already present unexpectedly')
          workflow.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          test = Path('nutev_tests/test_hetzner_ssh_keepalive.py')
          test.write_text('\n'.join([
              'from pathlib import Path',
              '',
              '',
              'ROOT = Path(__file__).resolve().parents[1]',
              'WORKFLOW = ROOT / ".github" / "workflows" / "deploy-hetzner.yml"',
              '',
              '',
              'def test_long_remote_deploy_has_client_keepalive() -> None:',
              '    text = WORKFLOW.read_text(encoding="utf-8")',
              '    configure = text.split("- name: Configure SSH", 1)[1].split("- name: Verify SSH access", 1)[0]',
              '    assert "ServerAliveInterval 30" in configure',
              '    assert "ServerAliveCountMax 10" in configure',
              '    assert "TCPKeepAlive yes" in configure',
              '    assert "chmod 600 ~/.ssh/config" in configure',
              '    assert "StrictHostKeyChecking=no" not in text',
              '',
          ]), encoding='utf-8')
          PY
          git rm .github/workflows/one-shot-ssh-keepalive-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-hetzner.yml nutev_tests/test_hetzner_ssh_keepalive.py
          git diff --cached --check
          git commit -m 'fix(deploy): keep long Hetzner SSH sessions alive'
          git push origin HEAD:fix/hetzner-ssh-keepalive-20260913
