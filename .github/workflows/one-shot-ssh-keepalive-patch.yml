name: one-shot-recovery-heartbeat-patch

on:
  push:
    branches:
      - fix/hetzner-ssh-keepalive-20260913

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/hetzner-ssh-keepalive-20260913
      - name: Add sanitized snapshot heartbeat and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/recovery_snapshot.py')
          text = path.read_text(encoding='utf-8')
          if 'def _snapshot_heartbeat(' not in text:
              import_anchor = 'import sqlite3\nimport stat\nimport tempfile\n'
              if import_anchor not in text:
                  raise SystemExit('recovery snapshot import anchor not found')
              text = text.replace(
                  import_anchor,
                  'import sqlite3\nimport stat\nimport tempfile\nimport threading\n',
                  1,
              )
              main_anchor = '\ndef main() -> int:\n'
              heartbeat = '''\n\ndef _snapshot_heartbeat(\n    stop: threading.Event, *, interval_seconds: float = 15.0\n) -> None:\n    """Emit path-free progress while a long quiesced snapshot is running."""\n    while not stop.wait(interval_seconds):\n        print(\n            json.dumps(\n                {"event": "snapshot_progress", "status": "RUNNING"},\n                sort_keys=True,\n            ),\n            flush=True,\n        )\n\n\ndef main() -> int:\n'''
              if main_anchor not in text:
                  raise SystemExit('recovery snapshot main anchor not found')
              text = text.replace(main_anchor, heartbeat, 1)
              old_main = '''    print(\n        json.dumps(\n            create_snapshot(args.source, args.backup, quiesced=args.quiesced),\n            sort_keys=True,\n        )\n    )\n    return 0\n'''
              new_main = '''    stop = threading.Event()\n    heartbeat = threading.Thread(\n        target=_snapshot_heartbeat,\n        args=(stop,),\n        daemon=True,\n        name="nutev-snapshot-heartbeat",\n    )\n    heartbeat.start()\n    try:\n        result = create_snapshot(args.source, args.backup, quiesced=args.quiesced)\n    finally:\n        stop.set()\n        heartbeat.join(timeout=1.0)\n    print(json.dumps(result, sort_keys=True), flush=True)\n    return 0\n'''
              if old_main not in text:
                  raise SystemExit('recovery snapshot print anchor not found')
              text = text.replace(old_main, new_main, 1)
              path.write_text(text, encoding='utf-8')

          test = Path('nutev_tests/test_recovery_snapshot_heartbeat.py')
          if not test.exists():
              test.write_text('\n'.join([
                  'import json',
                  '',
                  'from tools.recovery_snapshot import _snapshot_heartbeat',
                  '',
                  '',
                  'class _StopAfterOneHeartbeat:',
                  '    def __init__(self) -> None:',
                  '        self.calls = 0',
                  '',
                  '    def wait(self, interval_seconds: float) -> bool:',
                  '        assert interval_seconds == 0',
                  '        self.calls += 1',
                  '        return self.calls > 1',
                  '',
                  '',
                  'def test_snapshot_heartbeat_is_periodic_sanitized_json(capsys) -> None:',
                  '    stop = _StopAfterOneHeartbeat()',
                  '    _snapshot_heartbeat(stop, interval_seconds=0)',
                  '    output = capsys.readouterr().out.strip()',
                  '    assert stop.calls == 2',
                  '    assert json.loads(output) == {"event": "snapshot_progress", "status": "RUNNING"}',
                  '    assert "/" not in output',
                  '    assert "snapshot-source" not in output',
                  '    assert "snapshot-backups" not in output',
                  '',
              ]) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/recovery_snapshot.py nutev_tests/test_recovery_snapshot_heartbeat.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Recovery heartbeat patch already applied.'
            exit 0
          fi
          git commit -m 'fix(deploy): emit heartbeat during recovery snapshot'
          git push origin HEAD:fix/hetzner-ssh-keepalive-20260913
