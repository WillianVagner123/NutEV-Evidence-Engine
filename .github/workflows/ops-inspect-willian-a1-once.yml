name: ops-inspect-willian-a1-once

on:
  push:
    branches:
      - ops/inspect-willian-a1-20260922

permissions:
  contents: read

jobs:
  inspect:
    name: inspect Willian A1 production state
    runs-on: ubuntu-latest
    environment: HETZNER
    timeout-minutes: 10
    env:
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER }}
      HETZNER_PORT: ${{ vars.HETZNER_PORT }}
      HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
      HETZNER_APP_DIR: ${{ vars.HETZNER_APP_DIR }}

    steps:
      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Read production tenancy state
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          APP_DIR_Q=$(printf '%q' "$HETZNER_APP_DIR")
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15             -p "$PORT" "$HETZNER_USER@$HETZNER_HOST"             "APP_DIR=$APP_DIR_Q bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml exec -T nutev             python - <<'PY'
          import json, os, sqlite3
          db=os.environ.get("NUTEV_AUTH_DB") or "/app/project_output_reference/platform/auth.sqlite3"
          out={
              "account_active":False,
              "platform_admin":False,
              "workspace_exists":False,
              "workspace_owner":False,
              "project_exists":False,
              "application_exists":False,
              "application_type":None,
              "template_id":None,
          }
          with sqlite3.connect(db) as c:
              c.row_factory=sqlite3.Row
              user=c.execute(
                  "SELECT id,status,global_roles_json FROM platform_auth_users WHERE email=? COLLATE NOCASE",
                  ("wvagners@hotmail.com",),
              ).fetchone()
              if user is not None:
                  out["account_active"]=str(user["status"])=="active"
                  try: roles=json.loads(str(user["global_roles_json"] or "[]"))
                  except Exception: roles=[]
                  out["platform_admin"]="PLATFORM_ADMIN" in roles
                  ws=c.execute(
                      "SELECT id,owner_user_id,status FROM platform_workspaces WHERE slug=?",
                      ("willian-doutorado",),
                  ).fetchone()
                  if ws is not None:
                      out["workspace_exists"]=str(ws["status"])=="active"
                      out["workspace_owner"]=str(ws["owner_user_id"])==str(user["id"])
                      prj=c.execute(
                          "SELECT id,status FROM platform_projects WHERE workspace_id=? AND slug=?",
                          (str(ws["id"]),"artigo-1"),
                      ).fetchone()
                      if prj is not None:
                          out["project_exists"]=str(prj["status"])=="active"
                          app=c.execute(
                              "SELECT application_type,template_id,status FROM platform_research_applications WHERE project_id=? ORDER BY updated_at DESC LIMIT 1",
                              (str(prj["id"]),),
                          ).fetchone()
                          if app is not None:
                              out["application_exists"]=str(app["status"])=="active"
                              out["application_type"]=str(app["application_type"])
                              out["template_id"]=str(app["template_id"])
          print(json.dumps(out,sort_keys=True))
          PY
          REMOTE
