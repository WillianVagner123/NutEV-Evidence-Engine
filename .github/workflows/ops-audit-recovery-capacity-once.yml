name: ops-audit-recovery-capacity-once

on:
  push:
    branches:
      - ops/audit-recovery-capacity-20260922

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: HETZNER
    timeout-minutes: 10
    env:
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER }}
      HETZNER_PORT: ${{ vars.HETZNER_PORT }}
      HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Audit reclaimable capacity
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15             -p "$PORT" "$HETZNER_USER@$HETZNER_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "=== filesystem ==="
          df -Pk /var/lib/nutev-release-recovery
          echo "=== recovery-root-kb ==="
          du -sk /var/lib/nutev-release-recovery 2>/dev/null || true
          echo "=== docker-system-df ==="
          docker system df
          echo "=== docker-images ==="
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}} {{.CreatedSince}}' | head -n 80
          echo "=== running-images ==="
          docker ps --format '{{.Names}} {{.Image}}'
          echo "=== recovery-top-level ==="
          find /var/lib/nutev-release-recovery -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | head -n 80
          REMOTE
