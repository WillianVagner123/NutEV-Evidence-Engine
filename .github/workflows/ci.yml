name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/nutev-ci.txt
          python -m pip install --no-deps -e .
      - name: Run Reference Engine tests
        run: PYTHONPATH=src python -m pytest -q nutev_tests

  guardrail-contract:
    name: audit guardrail contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/nutev-ci.txt
          python -m pip install --no-deps -e .
      - name: Verify fail-closed ranking contract
        run: PYTHONPATH=src python -m pytest -q nutev_tests/test_rank_references.py
      - name: Run Scientific Workspace v2 death test
        run: python tools/audit_scientific_workspace_v2.py --compact
      - name: Run Synthesis Governance death test
        run: python tools/audit_synthesis_governance.py --compact
      - name: Run Governed Synthesis Release death test
        run: python tools/audit_governed_synthesis_release.py --compact
      - name: Run Governed Publication Manifest death test
        run: python tools/audit_governed_publication_manifest.py --compact
      - name: Run EvidenceClaim Review death test
        run: python tools/audit_evidence_claim_review.py --compact
      - name: Run ClaimEvaluation Appraisal death test
        run: python tools/audit_claim_evaluation_appraisal.py --compact
      - name: Run EvidenceSet Construction death test
        run: python tools/audit_evidence_set_construction.py --compact
      - name: Run RecommendationCandidate Drafting death test
        run: python tools/audit_recommendation_candidate_drafting.py --compact
      - name: Run RecommendationCandidate HumanValidation death test
        run: python tools/audit_recommendation_human_validation.py --compact
      - name: Run Recommendation Development death test
        run: python tools/audit_recommendation_development.py --compact
      - name: Run Recommendation Adoption death test
        run: python tools/audit_recommendation_adoption.py --compact
      - name: Run NutEV Scientific Closure death test
        run: python tools/audit_nutev_scientific_closure.py --compact

  windows-smoke:
    name: windows smoke (python 3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/nutev-ci.txt
          python -m pip install --no-deps -e .
      - name: CLI smoke
        run: |
          nutev --version
          nutev providers
      - name: Compile current product
        run: python -m compileall -q src tools
      - name: Ranking smoke without network
        run: python -m pytest -q nutev_tests/test_reference_queries.py nutev_tests/test_rank_references.py

  typecheck-provenance:
    name: typecheck provenance core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install type-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/nutev-ci.txt
          python -m pip install --no-deps -e .
      - name: Mypy Reference Engine provenance core
        run: >-
          mypy --ignore-missing-imports --check-untyped-defs
          src/nutev/audit_guardrails.py
          src/nutev/search/reference_queries.py
          src/nutev/search/official_sources.py

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile Python source and tools
        run: python -m compileall -q src tools nutev_tests
      - name: Check web JavaScript syntax
        run: |
          node --check apps/nutev-web/app.js
          node --check apps/nutev-web/product-ui.js
          node --check apps/nutev-web/document-classes.js
          node --check apps/nutev-web/saved-library.js
          node --check apps/nutev-web/search-library-ui.js
          node --check apps/nutev-web/saved-library-ui.js
          node --check apps/nutev-web/search-facets-ui.js
          node --check apps/nutev-web/intelligence.js
          node --check apps/nutev-web/synthesis-review.js
          node --check apps/nutev-web/synthesis-brief.js
          node --check apps/nutev-web/synthesis-governance.js
          node --check apps/nutev-web/synthesis-release.js
          node --check apps/nutev-web/synthesis-publication.js
          node --check apps/nutev-web/evidence-claims.js
          node --check apps/nutev-web/claim-appraisal.js
          node --check apps/nutev-web/evidence-sets.js
          node --check apps/nutev-web/recommendation-candidates.js
          node --check apps/nutev-web/recommendation-human-validation.js
          node --check apps/nutev-web/recommendation-development.js
          node --check apps/nutev-web/recommendation-adoption.js
          node --check apps/nutev-web/press-review.js
      - name: Install ruff
        run: python -m pip install ruff
      - name: Ruff blocking errors
        run: ruff check src tools nutev_tests --select F,E9
      - name: Ruff advisory style
        run: ruff check src tools nutev_tests || true

  production-recovery-readiness:
    name: production recovery readiness
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: HETZNER
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.sha }}
      HETZNER_HOST: ${{ vars.HETZNER_HOST }}
      HETZNER_USER: ${{ vars.HETZNER_USER }}
      HETZNER_PORT: ${{ vars.HETZNER_PORT }}
      HETZNER_KNOWN_HOSTS: ${{ vars.HETZNER_KNOWN_HOSTS }}
      HETZNER_APP_DIR: ${{ vars.HETZNER_APP_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate recovery readiness configuration
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TARGET_SHA"
          test -n "$HETZNER_HOST"
          test -n "$HETZNER_USER"
          test -n "$HETZNER_APP_DIR"
          test -n "$HETZNER_SSH_KEY"
          test -n "$HETZNER_KNOWN_HOSTS"
      - name: Configure SSH for recovery readiness
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          install -d -m 700 ~/.ssh
          python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          raw = os.environ["HETZNER_SSH_KEY"].strip().replace("\r\n", "\n").replace("\r", "\n")
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\n", "\n")
          candidate = raw.strip()
          if candidate.startswith("ssh-") or "BEGIN PUBLIC KEY" in candidate:
              raise SystemExit("private SSH key required")
          if not candidate.startswith("-----BEGIN "):
              try:
                  candidate = base64.b64decode("".join(candidate.split()), validate=True).decode("utf-8").strip()
              except (binascii.Error, UnicodeDecodeError, ValueError):
                  pass
          Path.home().joinpath(".ssh", "id_ed25519").write_text(candidate.strip() + "\n", encoding="utf-8")
          PY
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -P '' -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub 2>/dev/null
          chmod 600 ~/.ssh/id_ed25519.pub
          printf '%s\n' "$HETZNER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          HOST_LOOKUP="$HETZNER_HOST"
          if [[ "$PORT" != "22" ]]; then HOST_LOOKUP="[$HETZNER_HOST]:$PORT"; fi
          ssh-keygen -F "$HOST_LOOKUP" -f ~/.ssh/known_hosts >/dev/null
      - name: Collect failed deploy SHAs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          current = os.environ["TARGET_SHA"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/deploy-hetzner.yml/runs?status=failure&per_page=100"
          request = Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "NutEV-recovery-readiness",
          })
          with urlopen(request, timeout=20) as response:
              payload = json.load(response)
          values = set()
          for run in payload.get("workflow_runs", []):
              sha = run.get("head_sha", "")
              if (
                  run.get("conclusion") == "failure"
                  and run.get("head_branch") == "main"
                  and re.fullmatch(r"[0-9a-f]{40}", sha)
                  and sha != current
              ):
                  values.add(sha)
          Path("failed-deploy-shas.txt").write_text("".join(f"{sha}\n" for sha in sorted(values)), encoding="utf-8")
          print(f"failed_deploy_sha_count={len(values)}")
          PY
      - name: Prune only failed incomplete recovery directories
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          REMOTE_CMD="python3 - --base /var/lib/nutev-release-recovery --json"
          while IFS= read -r sha; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$sha" != "$TARGET_SHA" ]]
            REMOTE_CMD+=" --allow-sha $sha"
          done < failed-deploy-shas.txt
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -p "$PORT" "$HETZNER_USER@$HETZNER_HOST" "$REMOTE_CMD" \
            < tools/release_recovery_hygiene.py | tee recovery-hygiene.json
          python3 - <<'PY'
          import json
          report = json.load(open("recovery-hygiene.json", encoding="utf-8"))
          assert report["status"] == "PASS"
          assert report["scientific_data_modified"] is False
          PY
      - name: Verify snapshot capacity without stopping production
        shell: bash
        run: |
          set -euo pipefail
          PORT="${HETZNER_PORT:-22}"
          APP_DIR_Q=$(printf '%q' "$HETZNER_APP_DIR")
          TARGET_SHA_Q=$(printf '%q' "$TARGET_SHA")
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -p "$PORT" "$HETZNER_USER@$HETZNER_HOST" \
            "APP_DIR=$APP_DIR_Q TARGET_SHA=$TARGET_SHA_Q bash -s" <<'REMOTE' | tee recovery-capacity.txt
          set -euo pipefail
          cd "$APP_DIR"
          test -d .git
          ORIGIN_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$ORIGIN_MAIN" = "$TARGET_SHA"
          COMPOSE=(docker compose --env-file deploy/hetzner/.env -f deploy/hetzner/compose.yaml)
          OLD_CONTAINER="$("${COMPOSE[@]}" ps -q nutev 2>/dev/null)"
          test -n "$OLD_CONTAINER"
          test "$(docker inspect -f '{{.State.Running}}' "$OLD_CONTAINER")" = "true"
          OUTPUT_VOLUME="$(docker inspect -f '{{range .Mounts}}{{if and (eq .Destination "/app/project_output_reference") (eq .Type "volume")}}{{.Name}}{{end}}{{end}}' "$OLD_CONTAINER")"
          test -n "$OUTPUT_VOLUME"
          SOURCE_KB="$(docker exec "$OLD_CONTAINER" sh -c 'du -sk /app/project_output_reference | awk "{print \\$1}"')"
          [[ "$SOURCE_KB" =~ ^[0-9]+$ ]]
          mkdir -p /var/lib/nutev-release-recovery
          FREE_KB="$(df -Pk /var/lib/nutev-release-recovery | awk 'NR==2 {print $4}')"
          [[ "$FREE_KB" =~ ^[0-9]+$ ]]
          MARGIN_KB=1048576
          TEN_PERCENT=$((SOURCE_KB / 10))
          if (( TEN_PERCENT > MARGIN_KB )); then MARGIN_KB=$TEN_PERCENT; fi
          REQUIRED_KB=$((SOURCE_KB + MARGIN_KB))
          echo "source_kb=$SOURCE_KB"
          echo "free_kb=$FREE_KB"
          echo "margin_kb=$MARGIN_KB"
          echo "required_kb=$REQUIRED_KB"
          echo "production_running=true"
          echo "scientific_data_modified=false"
          if (( FREE_KB < REQUIRED_KB )); then
            echo "insufficient_snapshot_capacity=true" >&2
            exit 1
          fi
          echo "snapshot_capacity=PASS"
          REMOTE
      - name: Upload recovery readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-recovery-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            failed-deploy-shas.txt
            recovery-hygiene.json
            recovery-capacity.txt
          if-no-files-found: warn
          retention-days: 14
