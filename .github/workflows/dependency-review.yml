name: dependency-review

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable dependency comparison refs
        id: refs
        run: |
          python3 - <<'PYREF'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          name = os.environ["GITHUB_EVENT_NAME"]
          if name == "pull_request":
              base = event["pull_request"]["base"]["sha"]
              head = event["pull_request"]["head"]["sha"]
          elif name == "push":
              base = event["before"]
              head = os.environ["GITHUB_SHA"]
          elif name == "workflow_dispatch":
              head = os.environ["GITHUB_SHA"]
              base = subprocess.check_output(["git", "rev-parse", head + "^1"], text=True).strip()
          else:
              raise SystemExit("Unsupported dependency comparison event")
          if not all(re.fullmatch(r"[0-9a-f]{40}", x) and x != "0" * 40 for x in (base, head)) or base == head:
              raise SystemExit("Explicit distinct dependency comparison SHAs are required")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"base={base}\nhead={head}\n")
          PYREF
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        # This is intentionally blocking. A green workflow must mean that the
        # dependency-review action actually executed successfully. Repository
        # Settings > Code security & analysis > Dependency graph must therefore
        # be enabled. If GitHub reports that dependency review is unsupported,
        # the PR must stay red rather than silently converting that gap to PASS.
        with:
          base-ref: ${{ steps.refs.outputs.base }}
          head-ref: ${{ steps.refs.outputs.head }}
          fail-on-severity: high
          comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'on-failure' || 'never' }}
