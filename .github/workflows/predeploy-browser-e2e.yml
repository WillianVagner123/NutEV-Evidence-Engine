name: predeploy-browser-e2e

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-predeploy:
    name: Chromium pre-deploy product gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install NutEV and Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/nutev-ci.txt
          python -m pip install --no-deps -e .
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Run real Chromium pre-deploy audit
        env:
          NUTEV_DISABLE_NETWORK: "1"
          NUTEV_SEARCH_FULLTEXT_LIMIT: "0"
          NUTEV_ENVIRONMENT: "test"
          PYTHONPATH: src
        run: |
          mkdir -p browser_e2e_artifacts
          python tools/materialize_predeploy_e2e_context.py
          python apps/nutev-web/secure_server.py --host 127.0.0.1 --port 8765 > browser_e2e_artifacts/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen

          url = "http://127.0.0.1:8765/api/health"
          for attempt in range(60):
              try:
                  with urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  pass
              time.sleep(0.5)
          else:
              raise SystemExit("NutEV secure server did not become healthy")
          PY
          python tools/run_predeploy_browser_e2e.py
          python tools/run_predeploy_search_ui_execution_matrix.py
      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: predeploy-browser-e2e-${{ github.sha }}
          path: browser_e2e_artifacts/
          if-no-files-found: warn
          retention-days: 14
