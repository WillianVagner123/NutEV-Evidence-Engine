<!doctype html>
<html lang="pt-BR" data-title-pt="Redefinir senha — NutEV" data-title-en="Reset password — NutEV">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Redefinir senha — NutEV</title>
  <meta name="description" content="Redefinição de senha por link temporário do NutEV.">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./i18n.css">
  <link rel="stylesheet" href="./access-flow.css">
</head>
<body class="access-public-page">
  <main class="access-public-shell">
    <section class="access-intro" aria-labelledby="resetIntroTitle">
      <div class="access-brand"><div class="brand-mark">N</div><div><strong>NutEV</strong><span data-pt="Sistema de Evidências Científicas" data-en="Scientific Evidence System">Sistema de Evidências Científicas</span></div></div>
      <span class="access-eyebrow" data-pt="Recuperação de conta" data-en="Account recovery">Recuperação de conta</span>
      <h1 id="resetIntroTitle" data-pt="Defina uma nova senha com segurança." data-en="Set a new password securely.">Defina uma nova senha com segurança.</h1>
      <p data-pt="O link é de uso único. Ao concluir, todas as sessões ativas da conta serão encerradas." data-en="The link is single-use. When completed, all active sessions for the account will be revoked.">O link é de uso único. Ao concluir, todas as sessões ativas da conta serão encerradas.</p>
    </section>
    <section class="access-card" aria-labelledby="resetFormTitle">
      <span class="access-eyebrow" data-pt="Nova senha" data-en="New password">Nova senha</span>
      <h1 id="resetFormTitle" data-pt="Redefinir senha" data-en="Reset password">Redefinir senha</h1>
      <p id="resetLoading" data-pt="Validando o link…" data-en="Validating link…">Validando o link…</p>
      <div id="resetPerson" class="invitation-person" hidden>
        <strong id="resetName"></strong>
        <span id="resetEmail"></span>
        <span id="resetExpiry"></span>
      </div>
      <form id="resetPasswordForm" class="access-form" hidden novalidate>
        <label><span data-pt="Nova senha" data-en="New password">Nova senha</span>
          <input id="resetPassword" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
        </label>
        <label><span data-pt="Confirmar nova senha" data-en="Confirm new password">Confirmar nova senha</span>
          <input id="resetConfirmation" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
        </label>
        <button id="resetSubmit" class="access-submit" type="submit" data-pt="Salvar nova senha" data-en="Save new password">Salvar nova senha</button>
      </form>
      <div id="resetStatus" class="access-status" role="status" aria-live="polite"></div>
      <div class="access-links"><a href="/login.html" data-pt="Ir para o login" data-en="Go to sign in">Ir para o login</a></div>
    </section>
  </main>
  <script type="module" src="./reset-password.js"></script>
</body>
</html>
