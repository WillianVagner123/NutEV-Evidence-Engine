<!doctype html>
<html lang="pt-BR" data-title-pt="Esqueci minha senha — NutEV" data-title-en="Forgot password — NutEV">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <title>Esqueci minha senha — NutEV</title>
  <meta name="description" content="Solicitação segura de redefinição de senha do NutEV.">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./i18n.css">
  <link rel="stylesheet" href="./access-flow.css">
</head>
<body class="access-public-page">
  <main class="access-public-shell">
    <section class="access-intro" aria-labelledby="forgotIntroTitle">
      <div class="access-brand"><div class="brand-mark">N</div><div><strong>NutEV</strong><span data-pt="Sistema de Evidências Científicas" data-en="Scientific Evidence System">Sistema de Evidências Científicas</span></div></div>
      <span class="access-eyebrow" data-pt="Recuperação de conta" data-en="Account recovery">Recuperação de conta</span>
      <h1 id="forgotIntroTitle" data-pt="Redefina sua senha com um link temporário." data-en="Reset your password with a temporary link.">Redefina sua senha com um link temporário.</h1>
      <p data-pt="Por segurança, a resposta é sempre a mesma, exista ou não uma conta para o e-mail informado." data-en="For security, the response is always the same whether or not an account exists for the submitted email.">Por segurança, a resposta é sempre a mesma, exista ou não uma conta para o e-mail informado.</p>
    </section>
    <section class="access-card" aria-labelledby="forgotFormTitle">
      <span class="access-eyebrow" data-pt="Recuperar acesso" data-en="Recover access">Recuperar acesso</span>
      <h1 id="forgotFormTitle" data-pt="Esqueci minha senha" data-en="Forgot my password">Esqueci minha senha</h1>
      <form id="forgotPasswordForm" class="access-form" method="post" action="/api/auth/password-reset/request" novalidate>
        <label><span data-pt="E-mail da conta" data-en="Account email">E-mail da conta</span>
          <input id="forgotEmail" name="email" type="email" autocomplete="email" inputmode="email" maxlength="320" required autofocus>
        </label>
        <button id="forgotSubmit" class="access-submit" type="submit" data-pt="Enviar instruções" data-en="Send instructions">Enviar instruções</button>
      </form>
      <div id="forgotStatus" class="access-status" role="status" aria-live="polite"></div>
      <div class="access-links"><a href="/login.html" data-pt="Voltar ao login" data-en="Back to sign in">Voltar ao login</a></div>
    </section>
  </main>
  <script type="module" src="./forgot-password.js"></script>
</body>
</html>
